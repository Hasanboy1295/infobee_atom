spring.application.name=atom-backend
server.port=8080

spring.profiles.active=${PROFILE:local}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.connect-retries=10
spring.datasource.hikari.connection-timeout=10000
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.h2-console-enabled=false
app.security.api-docs-public=false
app.security.auth-cookie-name=${AUTH_COOKIE_NAME:ATOM_AUTH}
app.security.csrf-cookie-name=${CSRF_COOKIE_NAME:ATOM_CSRF}
app.security.cookie-secure=${COOKIE_SECURE:false}
app.security.cookie-same-site=${COOKIE_SAME_SITE:Lax}
app.upload.dir=${UPLOAD_DIR:uploads}
app.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai.enabled=${AI_ENABLED:true}
app.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
app.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:30000}
app.ai.max-attempts=${AI_MAX_ATTEMPTS:2}
app.ai.retry-backoff-ms=${AI_RETRY_BACKOFF_MS:1500}
app.pubchem.base-url=${PUBCHEM_BASE_URL:https://pubchem.ncbi.nlm.nih.gov}
app.pubchem.enabled=${PUBCHEM_ENABLED:true}
app.pubchem.connect-timeout-ms=${PUBCHEM_CONNECT_TIMEOUT_MS:5000}
app.pubchem.read-timeout-ms=${PUBCHEM_READ_TIMEOUT_MS:15000}
app.internal.ai-secret=${AI_INTERNAL_SECRET:}
