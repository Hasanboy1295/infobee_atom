spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atom}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:atom}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.flyway.schemas=${DB_SCHEMA:public}
spring.flyway.default-schema=${DB_SCHEMA:public}
spring.flyway.locations=classpath:db/migration,classpath:db/migration-postgres
spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET:}
app.security.h2-console-enabled=false
app.security.api-docs-public=${API_DOCS_PUBLIC:false}
app.security.auth-cookie-name=${AUTH_COOKIE_NAME:ATOM_AUTH}
app.security.csrf-cookie-name=${CSRF_COOKIE_NAME:ATOM_CSRF}
app.security.cookie-secure=${COOKIE_SECURE:true}
app.security.cookie-same-site=${COOKIE_SAME_SITE:Lax}
